[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sir-device"
version = "0.1.0"
description = "Sir Device mobile-first reseller marketplace"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "SQLAlchemy==2.0.50",
  "alembic>=1.18,<2",
  "Jinja2==3.1.6",
  "python-multipart==0.0.29",
  "PyJWT==2.13.0",
  "email-validator==2.3.0",
  "boto3==1.43.18",
  "openpyxl==3.1.5",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
